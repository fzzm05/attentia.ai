[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attentia-ai"
version = "0.1.0"
description = "Local adaptive study assistant demo with camera, microphone, and RL policy orchestration."
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "mediapipe>=0.10,<0.11",
  "numpy>=2.0,<3.0",
  "opencv-python>=4.9,<5.0",
  "sounddevice>=0.5,<0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
